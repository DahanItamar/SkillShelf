name: verify

# Blocking on pull request. scripts/verify.sh exits non-zero on any structural
# failure, which fails the step and therefore the check run.
#
# No setup step, no cache, no dependency install: the script is POSIX shell and
# standard utilities only (SPEC.md AC-043). If this workflow ever grows a
# language runtime, SPEC.md section 4 has to be amended first.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural verification
        run: sh scripts/verify.sh
